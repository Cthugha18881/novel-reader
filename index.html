<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelTranslate AI - เว็บแปลและอ่านนิยายจีน</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="app-body" class="theme-sepia">

  <!-- TOP APP BAR -->
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn" onclick="openBookshelfModal()" title="ชั้นหนังสือ">📚 ชั้นหนังสือ</button>
      <button class="icon-btn" onclick="openGlossaryModal()" title="คลังคำศัพท์">📖 คลังศัพท์</button>
      <button class="btn btn-primary" onclick="openModal('import-modal')">+ วางลิงก์</button>
    </div>
    <div class="header-center">
      <div id="display-book-title" class="truncate font-semibold">NovelTranslate AI</div>
      <div id="display-chap-title" class="truncate text-sm opacity-75">พร้อมใช้งาน</div>
    </div>
    <div class="header-right">
      <div class="font-controls">
        <button class="icon-btn" onclick="adjustFontSize(-2)" title="ลดขนาดอักษร">A-</button>
        <button class="icon-btn" onclick="adjustFontSize(2)" title="เพิ่มขนาดอักษร">A+</button>
      </div>
      <button id="desktop-theme-btn" class="icon-btn" onclick="cycleTheme()" title="เปลี่ยนธีม">ถนอมสายตา</button>
      <button class="icon-btn" onclick="exportTxt()" title="ดาวน์โหลดไฟล์ TXT">💾 TXT</button>
      <button class="icon-btn" onclick="openModal('settings-modal')" title="ตั้งค่าระบบ">⚙️</button>
    </div>
  </header>

  <!-- MAIN READING CONTAINER -->
  <main class="reading-viewport">
    <div id="reading-content" class="reading-content-container">
      <!-- เนื้อหาจะถูกเรนเดอร์ที่นี่ -->
    </div>

    <!-- BOTTOM FLOATING CONTROLS -->
    <nav class="bottom-nav-bar">
      <button class="btn nav-btn" onclick="prevChapter()">◀ ตอนก่อนหน้า</button>
      <button class="btn nav-btn btn-primary" onclick="handleNextChapterClick()">ตอนถัดไป ▶</button>
    </nav>
  </main>

  <!-- FLOATING SELECTION BAR -->
  <div id="selection-bar" class="selection-action-bar" style="display: none;">
    <span id="sel-preview-text" class="sel-text-truncate"></span>
    <button class="btn btn-sm" onclick="findChineseForSelection()">🔍 หาคำจีน</button>
    <button class="btn btn-sm btn-primary" onclick="addFromSelectionBar()">+ ใส่คลังศัพท์</button>
    <button class="btn btn-sm btn-danger" onclick="dismissSelectionBar()">✕</button>
  </div>

  <!-- TERM QUICK POPOVER -->
  <div id="term-popover" class="term-popover-box" style="display: none;">
    <div id="popover-text" class="popover-content"></div>
    <div class="popover-actions">
      <button id="popover-edit-btn" class="btn btn-sm">แก้ไขคำแปล</button>
    </div>
  </div>

  <!-- GLOBAL ACTION TOAST -->
  <div id="global-action-toast" class="action-toast" style="display: none;">
    <span class="spinner-icon"></span>
    <span id="global-toast-msg">กำลังประมวลผล...</span>
  </div>

  <!-- ==================== MODALS ==================== -->

  <!-- 1. IMPORT MODAL -->
  <div id="import-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>วาง URL หน้านิยาย</h3>
        <button class="close-btn" onclick="handleImportCancel()">✕</button>
      </div>
      <div class="modal-body">
        <label>URL หน้านิยาย (เช่น 69shuba, biquge ฯลฯ)</label>
        <input type="text" id="import-url" class="form-input" placeholder="https://www.69shuba.com/txt/..." />
        
        <label style="margin-top: 12px; display: block;">แนวเรื่อง / สไตล์สำนวน (Genre)</label>
        <select id="import-novel-genre" class="form-select">
          <option value="xianxia">เซียนเซีย / เทพเซียนบำเพ็ญเพียรเต๋า</option>
          <option value="wuxia">กำลังภายใน / ยุทธภพดั้งเดิม</option>
          <option value="system_game">ระบบเกม / ดันเจี้ยน / เกิดใหม่</option>
          <option value="scifi">ไซไฟ / ผจญภัยอวกาศดวงดาว</option>
          <option value="general">ทั่วไป / วรรณกรรมแปลจีน</option>
        </select>

        <div id="import-status" style="margin-top: 10px; font-size: 13px; color: #38bdf8;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="handleImportCancel()">ยกเลิก</button>
        <button type="button" id="start-btn" class="btn btn-primary" onclick="startTranslateFirst(event)">
          <span id="start-btn-text">เริ่มแปลตอนนี้</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. BOOKSHELF MODAL -->
  <div id="bookshelf-modal" class="modal-overlay">
    <div class="modal-card modal-lg">
      <div class="modal-header">
        <h3>📚 ชั้นหนังสือส่วนตัว</h3>
        <button class="close-btn" onclick="closeModal('bookshelf-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div id="bookshelf-grid" class="bookshelf-grid-container">
          <!-- รายการหนังสือ -->
        </div>
      </div>
    </div>
  </div>

  <!-- 3. GLOSSARY MODAL -->
  <div id="glossary-modal" class="modal-overlay">
    <div class="modal-card modal-lg">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <h3>📖 คลังคำศัพท์แปลเฉพาะ</h3>
          <span id="glossary-book-context" style="font-size:12px; opacity:0.7;"></span>
        </div>
        <button class="close-btn" onclick="closeModal('glossary-modal')">✕</button>
      </div>
      <div class="modal-body">
        <!-- ADD TERM FORM -->
        <div class="glossary-add-bar">
          <input type="text" id="gloss-src" class="form-input" placeholder="ภาษาจีน (เช่น 李林)" style="flex: 2;" />
          <input type="text" id="gloss-tgt" class="form-input" placeholder="คำแปลไทย (เช่น หลี่หลิน)" style="flex: 2;" />
          <select id="gloss-cat" class="form-select" style="flex: 1.5;">
            <option value="character">ตัวละคร</option>
            <option value="title">ฉายา/ตำแหน่ง</option>
            <option value="location">สถานที่</option>
            <option value="skill">วิชา/ทักษะ</option>
            <option value="equipment">ของวิเศษ/ไอเทม</option>
            <option value="resource">ทรัพยากร/สมุนไพร</option>
            <option value="realm">ระดับพลัง</option>
          </select>
          <button type="button" class="btn btn-primary" onclick="addGlossary()">+ เพิ่มคำศัพท์</button>
        </div>

        <!-- CATEGORY TABS -->
        <div class="glossary-tabs-bar">
          <button class="cat-tab-btn active" onclick="switchGlossaryCategory('all', event)">ทั้งหมด</button>
          <button class="cat-tab-btn" onclick="switchGlossaryCategory('character', event)">👤 ตัวละคร</button>
          <button class="cat-tab-btn" onclick="switchGlossaryCategory('title', event)">🎖️ ฉายา/ตำแหน่ง</button>
          <button class="cat-tab-btn" onclick="switchGlossaryCategory('location', event)">🏰 สถานที่</button>
          <button class="cat-tab-btn" onclick="switchGlossaryCategory('skill', event)">⚡ วิชา/ทักษะ</button>
          <button class="cat-tab-btn" onclick="switchGlossaryCategory('equipment', event)">🗡️ ของวิเศษ</button>
          <button class="cat-tab-btn" onclick="switchGlossaryCategory('resource', event)">🌿 สมุนไพร</button>
          <button class="cat-tab-btn" onclick="switchGlossaryCategory('realm', event)">🧬 ระดับพลัง</button>
        </div>

        <!-- SEARCH & FILTER CONTROLS -->
        <div class="glossary-filter-bar">
          <input type="text" id="gloss-search-input" class="form-input" placeholder="ค้นหาคำศัพท์..." oninput="renderGlossaryUI()" style="flex: 2;" />
          <select id="gloss-scope-filter" class="form-select" onchange="renderGlossaryUI()" style="flex: 1;">
            <option value="all">คำศัพท์ทั้งหมด</option>
            <option value="current_book">เฉพาะเรื่องปัจจุบัน</option>
            <option value="global_only">เฉพาะสากล (Global)</option>
          </select>
          <select id="gloss-sort-select" class="form-select" onchange="renderGlossaryUI()" style="flex: 1;">
            <option value="count_desc">ความถี่ (มาก ➔ น้อย)</option>
            <option value="time_desc">เพิ่มล่าสุด</option>
            <option value="time_asc">เก่าสุด</option>
            <option value="th_asc">ก-ฮ</option>
            <option value="len_desc">ความยาวคำจีน</option>
          </select>
        </div>

        <!-- BATCH TOOLBAR -->
        <div id="gloss-batch-toolbar" class="batch-toolbar" style="display: none;">
          <span id="gloss-batch-count">เลือก 0 คำ</span>
          <button class="btn btn-sm btn-danger" onclick="deleteSelectedGlossaryTerms()">ลบคำที่เลือก</button>
        </div>

        <!-- GLOSSARY LIST CONTAINER -->
        <div id="glossary-list" class="glossary-items-container">
          <!-- รายการคำศัพท์ -->
        </div>
      </div>
    </div>
  </div>

  <!-- 4. EDIT TERM MODAL -->
  <div id="edit-term-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>แก้ไขคำแปลในคลังศัพท์</h3>
        <button class="close-btn" onclick="closeModal('edit-term-modal')">✕</button>
      </div>
      <div class="modal-body">
        <label>คำภาษาจีนต้นฉบับ:</label>
        <div id="edit-term-src-label" style="font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #2563eb;"></div>
        
        <label>คำแปลภาษาไทยที่ต้องการ:</label>
        <input type="text" id="edit-term-tgt-input" class="form-input" />

        <label style="margin-top: 10px; display: block;">หมวดหมู่:</label>
        <select id="edit-term-cat-select" class="form-select">
          <option value="character">ตัวละคร</option>
          <option value="title">ฉายา/ตำแหน่ง</option>
          <option value="location">สถานที่</option>
          <option value="skill">วิชา/ทักษะ</option>
          <option value="equipment">ของวิเศษ/ไอเทม</option>
          <option value="resource">ทรัพยากร/สมุนไพร</option>
          <option value="realm">ระดับพลัง</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal('edit-term-modal')">ยกเลิก</button>
        <button type="button" class="btn btn-primary" onclick="saveEditedGlossaryTerm()">บันทึกการแก้ไข</button>
      </div>
    </div>
  </div>

  <!-- 5. SETTINGS MODAL -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚙️ ตั้งค่าระบบและการแปล</h3>
        <button class="close-btn" onclick="closeModal('settings-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label>Google Gemini API Keys (คลังคีย์หมุนเวียน)</label>
          <button id="fetch-models-btn" type="button" class="btn btn-sm" onclick="fetchLiveModels()">ตรวจเช็กโมเดล</button>
        </div>
        <textarea id="gemini-keys-area" class="form-input" rows="3" placeholder="วาง Gemini API Key ที่นี่ (ขึ้นต้นด้วย AIzaSy... หรือ AQ... คั่นด้วยบรรทัดใหม่กรณีมีหลายคีย์)"></textarea>
        <div id="fetch-status-text" style="display:none; font-size:12px; margin-top:4px;"></div>
        <p style="font-size: 11px; opacity: 0.7; margin-top: 4px;">* เมื่อคีย์ติด Rate Limit (429) ระบบจะสลับไปใช้คีย์ถัดไปให้อัตโนมัติ</p>

        <label style="margin-top: 12px; display: block;">โมเดล AI ตัวหลัก (Primary Model)</label>
        <select id="gemini-primary-model" class="form-select">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        </select>

        <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px;">
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;">
            <input type="checkbox" id="enable-infinite-scroll" checked />
            เปิดใช้ Infinite Scroll (เลื่อนอ่านต่อเนื่องอัตโนมัติ)
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal('settings-modal')">ยกเลิก</button>
        <button type="button" class="btn btn-primary" onclick="saveSettings()">บันทึกการตั้งค่า</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS EXECUTION ORDER -->
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/glossary.js"></script>
  <script src="js/shelf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
