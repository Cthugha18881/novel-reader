<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NovelTranslate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* RESET & BASE STYLES (No CDN Dependency) */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    /* THEMES */
    body.theme-sepia { background-color: #f4ecd8; color: #2b2114; }
    body.theme-light { background-color: #f8fafc; color: #1e293b; }
    body.theme-dark  { background-color: #0d1117; color: #e6edf3; }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid rgba(0,0,0,0.08);
      backdrop-filter: blur(8px);
      background-color: inherit;
    }
    body.theme-dark header { border-bottom-color: rgba(255,255,255,0.1); }
    .brand-box { display: flex; align-items: center; gap: 8px; }
    .brand-icon {
      width: 30px; height: 30px; border-radius: 6px;
      background: #2563eb; color: #fff; font-family: 'Kanit', sans-serif;
      font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center;
    }
    .brand-title { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 15px; line-height: 1.2; }
    .brand-sub { font-size: 11px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn {
      padding: 6px 12px; font-size: 13px; font-weight: 500;
      border-radius: 6px; border: 1px solid rgba(0,0,0,0.12);
      background: transparent; color: inherit; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      font-family: inherit;
    }
    body.theme-dark .btn { border-color: rgba(255,255,255,0.15); }
    .btn:hover { background-color: rgba(0,0,0,0.05); }
    body.theme-dark .btn:hover { background-color: rgba(255,255,255,0.08); }
    .btn-primary { background: #2563eb !important; color: #fff !important; border: none !important; }
    .btn-primary:hover { background: #1d4ed8 !important; }

    /* PREFETCH BADGE */
    #prefetch-badge {
      display: none; font-size: 10px; padding: 3px 8px; border-radius: 999px;
      background: #dcfce7; color: #166534; font-weight: 600; border: 1px solid #86efac;
    }
    body.theme-dark #prefetch-badge { background: #064e3b; color: #a7f3d0; border-color: #047857; }

    /* MAIN READING CANVAS */
    main {
      flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
      padding: 20px 16px 100px 16px;
    }
    @media (min-width: 768px) { main { padding-bottom: 40px; } }

    .chapter-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 10px; margin-bottom: 18px;
    }
    body.theme-dark .chapter-header { border-bottom-color: rgba(255,255,255,0.1); }
    .chap-heading { font-family: 'Kanit', sans-serif; font-size: 20px; font-weight: 600; }

    /* READING PARAGRAPHS */
    #reading-content { line-height: 1.85; user-select: text; }
    .para-item { padding: 4px 0; cursor: pointer; border-radius: 4px; }
    .para-th { font-size: inherit; }
    .para-th span.term { font-weight: 600; color: #2563eb; }
    body.theme-dark .para-th span.term { color: #60a5fa; }
    .para-src {
      display: none; margin-top: 6px; padding: 8px 10px;
      border-radius: 4px; font-size: 13px; opacity: 0.75;
      background: rgba(0,0,0,0.04); border-left: 3px solid #f59e0b;
      font-family: monospace;
    }
    body.theme-dark .para-src { background: rgba(255,255,255,0.05); }

    /* BOTTOM NAV FOR CHAPTERS */
    .chap-nav {
      margin-top: 30px; padding-top: 18px;
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex; justify-content: space-between; align-items: center;
    }
    body.theme-dark .chap-nav { border-top-color: rgba(255,255,255,0.1); }

    /* MOBILE DOCK */
    .mobile-dock {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: inherit; border-top: 1px solid rgba(0,0,0,0.08);
      padding: 8px 12px; justify-content: space-around; align-items: center;
      backdrop-filter: blur(12px);
    }
    body.theme-dark .mobile-dock { border-top-color: rgba(255,255,255,0.1); }
    @media (min-width: 768px) { .mobile-dock { display: none; } }

    /* MODAL WINDOWS (CRITICAL: HIDDEN BY DEFAULT) */
    .modal-overlay {
      display: none; /* MUST BE HIDDEN */
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex !important; }
    .modal-box {
      width: 100%; max-width: 440px; border-radius: 12px;
      padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      background-color: #fff; color: #1e293b;
    }
    body.theme-sepia .modal-box { background-color: #fbf7ee; color: #2b2114; border: 1px solid #e9dac1; }
    body.theme-dark .modal-box  { background-color: #161b22; color: #e6edf3; border: 1px solid #30363d; }

    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-title { font-family: 'Kanit', sans-serif; font-size: 16px; font-weight: 600; }
    .modal-close { background: transparent; border: none; font-size: 18px; cursor: pointer; color: inherit; opacity: 0.6; }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; opacity: 0.8; }
    .form-input {
      width: 100%; padding: 8px 10px; font-size: 13px; border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.15); outline: none; background: #fff; color: #000;
      font-family: inherit;
    }
    body.theme-dark .form-input { background: #0d1117; color: #fff; border-color: rgba(255,255,255,0.2); }
    .status-msg {
      display: none; padding: 8px 10px; border-radius: 6px; font-size: 12px;
      margin-top: 8px; line-height: 1.4;
    }

    /* LOADER SPINNER */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid #fff; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="theme-sepia" id="app-body">

  <!-- TOP HEADER -->
  <header>
    <div class="brand-box">
      <div class="brand-icon">N</div>
      <div>
        <div class="brand-title">NovelTranslate AI</div>
        <div class="brand-sub" id="header-chap-title">ตอนปัจจุบัน</div>
      </div>
    </div>
    <div class="header-actions">
      <div id="prefetch-badge">ตอนถัดไปพร้อม</div>
      <button class="btn btn-primary" onclick="openModal('import-modal')">+ วางลิงก์</button>
      <button class="btn" onclick="openModal('glossary-modal')">ศัพท์</button>
      <button class="btn" onclick="openModal('settings-modal')">ตั้งค่า</button>
    </div>
  </header>

  <!-- MAIN READING CANVAS -->
  <main>
    <div class="chapter-header">
      <div>
        <h1 class="chap-heading" id="display-chap-title">ยินดีต้อนรับ</h1>
      </div>
      <button class="btn" onclick="exportTxt()" style="font-size: 11px;">บันทึก .TXT</button>
    </div>

    <!-- Reading Paragraphs -->
    <div id="reading-content"></div>

    <!-- Chapter Navigation -->
    <div class="chap-nav">
      <button class="btn" onclick="prevChapter()">← ตอนก่อนหน้า</button>
      <button class="btn btn-primary" id="next-chap-btn" onclick="handleNextChapterClick()">
        <span id="next-btn-text">ตอนถัดไป →</span>
      </button>
    </div>
  </main>

  <!-- MOBILE BOTTOM DOCK -->
  <nav class="mobile-dock">
    <button class="btn" onclick="adjustFontSize(-1)">A-</button>
    <button class="btn" id="mobile-theme-btn" onclick="cycleTheme()">ถนอมสายตา</button>
    <button class="btn" onclick="adjustFontSize(1)">A+</button>
    <button class="btn" onclick="openModal('glossary-modal')">คลังศัพท์</button>
  </nav>

  <!-- MODAL 1: IMPORT & TRANSLATE -->
  <div class="modal-overlay" id="import-modal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">วาง URL หน้านิยาย</div>
        <button class="modal-close" onclick="closeModal('import-modal')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">URL หน้านิยาย (เช่น 69shuba)</label>
        <input type="url" id="import-url" class="form-input" placeholder="https://www.69shuba.com/txt/88724/40711443">
      </div>
      <div class="status-msg" id="import-status"></div>
      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button class="btn" style="flex: 1;" onclick="closeModal('import-modal')">ยกเลิก</button>
        <button class="btn btn-primary" style="flex: 2;" id="start-btn" onclick="startTranslateFirst()">
          <span id="start-btn-text">เริ่มแปลตอนนี้</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: GLOSSARY -->
  <div class="modal-overlay" id="glossary-modal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">คลังคำศัพท์เฉพาะ (Glossary)</div>
        <button class="modal-close" onclick="closeModal('glossary-modal')">✕</button>
      </div>
      <div style="display: flex; gap: 6px; margin-bottom: 12px;">
        <input type="text" id="gloss-src" class="form-input" placeholder="คำเดิม (เช่น 林动)" style="flex: 1;">
        <input type="text" id="gloss-tgt" class="form-input" placeholder="คำแปล (เช่น หลินตง)" style="flex: 1;">
        <button class="btn btn-primary" onclick="addGlossary()">เพิ่ม</button>
      </div>
      <div id="glossary-list" style="max-height: 180px; overflow-y: auto; font-size: 13px;"></div>
    </div>
  </div>

  <!-- MODAL 3: SETTINGS -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">ตั้งค่า API</div>
        <button class="modal-close" onclick="closeModal('settings-modal')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Google Gemini API Key</label>
        <input type="password" id="gemini-key" class="form-input" placeholder="AIzaSy...">
      </div>
      <div class="form-group">
        <label class="form-label">โมเดล AI (Active Model)</label>
        <select id="gemini-model" class="form-input">
          <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash-Lite (แนะนำ / สปีดเร็ว)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (เรือธง / สำนวนดี)</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        </select>
      </div>
      <div style="margin-top: 14px;">
        <button class="btn btn-primary" style="width: 100%;" onclick="saveSettings()">บันทึกการตั้งค่า</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <script>
    // STATE
    let currentTheme = 'sepia';
    let currentFontSize = 18;
    let currentUrl = "";
    let nextUrlCalculated = "";
    let prefetchedData = null; // Buffer: { title, paragraphs, nextUrl }
    let isPrefetching = false;

    let glossary = {};
    try {
      glossary = JSON.parse(localStorage.getItem('nov_gloss') || '{"林动":"หลินตง","九品":"ขั้นเก้า"}');
    } catch(e) { glossary = {}; }

    let chapters = [
      {
        title: "คู่มือเริ่มต้น",
        paragraphs: [
          { th: "ยินดีต้อนรับสู่ NovelTranslate AI", src: "Welcome to NovelTranslate" },
          { th: "1. กดปุ่ม '+ วางลิงก์' ด้านบน แล้วใส่ URL หน้านิยาย (เช่น เว็บ 69shuba)", src: "Step 1" },
          { th: "2. ระบบจะแปลบทให้อัตโนมัติ และคำนวณลิงก์ตอนถัดไปรอไว้ให้", src: "Step 2" },
          { th: "3. เมื่ออ่านจบตอน กดปุ่ม 'ตอนถัดไป →' บทใหม่จะถูกดึงมาแปลทันที!", src: "Step 3" }
        ]
      }
    ];
    let currentChapterIndex = 0;

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      renderChapter();
      renderGlossary();
    });

    // THEME & FONT
    function cycleTheme() {
      const themes = ['sepia', 'light', 'dark'];
      currentTheme = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
      document.getElementById('app-body').className = 'theme-' + currentTheme;
      document.getElementById('mobile-theme-btn').innerText = 
        currentTheme === 'sepia' ? 'ถนอมสายตา' : (currentTheme === 'light' ? 'สว่าง' : 'มืด');
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.min(26, Math.max(14, currentFontSize + delta));
      document.getElementById('reading-content').style.fontSize = currentFontSize + 'px';
    }

    // MODAL HANDLERS
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // RENDER CONTENT
    function renderChapter() {
      const chap = chapters[currentChapterIndex];
      document.getElementById('display-chap-title').innerText = chap.title;
      document.getElementById('header-chap-title').innerText = chap.title;

      const container = document.getElementById('reading-content');
      container.innerHTML = "";
      container.style.fontSize = currentFontSize + 'px';

      chap.paragraphs.forEach((p, idx) => {
        const pEl = document.createElement('div');
        pEl.className = 'para-item';

        let thText = String(p.th || "");
        Object.values(glossary).forEach(name => {
          if (name && typeof name === 'string' && name.trim()) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            thText = thText.replace(new RegExp(`(${escaped})`, 'g'), '<span class="term">$1</span>');
          }
        });

        pEl.innerHTML = `
          <div class="para-th" onclick="toggleSrc(${idx})">${thText}</div>
          <div class="para-src" id="src-${idx}">${p.src || ''}</div>
        `;
        container.appendChild(pEl);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleSrc(idx) {
      const el = document.getElementById(`src-${idx}`);
      if (el) el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    // SCRAPER ENGINE WITH NUMBER SEQUENCING
    async function scrapePage(url) {
      // 1. Fetch via Jina AI
      let rawText = "";
      try {
        const res = await fetch(`https://r.jina.ai/${url}`);
        if (res.ok) {
          const md = await res.text();
          const lines = md.split('\n').map(l => l.trim()).filter(l => l.length > 10 && !l.startsWith('!') && !l.startsWith('['));
          rawText = lines.slice(0, 35).join('\n\n');
        }
      } catch (e) {}

      // 2. Fetch via Allorigins fallback
      if (!rawText || rawText.length < 50) {
        const pRes = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const pData = await pRes.json();
        if (pData.contents) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(pData.contents, 'text/html');
          const paras = [];
          doc.querySelectorAll('article p, .content p, #content, .txtnav, p').forEach(el => {
            const t = el.innerText ? el.innerText.trim() : '';
            if (t.length > 20) paras.push(t);
          });
          rawText = paras.slice(0, 35).join('\n\n');
        }
      }

      if (!rawText || rawText.length < 30) throw new Error("ไม่สามารถดึงข้อความจากเว็บนี้ได้");

      // 3. Smart Next URL Predictor (เช่น .../40711443 -> .../40711444)
      let nextUrl = null;
      const numMatch = url.match(/^(.*?)(\d+)(\.html?|\/)?$/);
      if (numMatch) {
        const prefix = numMatch[1];
        const num = numMatch[2];
        const suffix = numMatch[3] || '';
        const nextNum = (parseInt(num, 10) + 1).toString();
        nextUrl = prefix + nextNum + suffix;
      }

      return { text: rawText, nextUrl: nextUrl };
    }

    // GEMINI TRANSLATION
    async function translateText(rawText) {
      const key = (localStorage.getItem('nov_gemini_key') || "").trim();
      const model = (localStorage.getItem('nov_gemini_model') || "gemini-3.5-flash-lite").trim();

      if (!key) throw new Error("กรุณาใส่ API Key ในเมนู 'ตั้งค่า' ก่อน");

      const termList = Object.entries(glossary).map(([k,v]) => `${k}=${v}`).join(", ");
      const prompt = `คุณคือนักแปลนิยาย แปลข้อความต่อไปนี้เป็นภาษาไทยให้อ่านสนุก ไหลลื่น สละสลวย
คำศัพท์เฉพาะ: [${termList}]
ตอบกลับเฉพาะรูปแบบ JSON Array: [{"th": "คำแปลไทย", "src": "ข้อความต้นฉบับ"}] ไม่ต้องใส่คำอธิบายอื่น`;

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: `${prompt}\n\n${rawText.substring(0, 4500)}` }] }]
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || "ยิง API ไม่สำเร็จ");

      let outText = data.candidates[0].content.parts[0].text;
      const jsonMatch = outText.match(/\[\s*\{[\s\S]*\}\s*\]/);
      if (jsonMatch) outText = jsonMatch[0];
      else outText = outText.replace(/```json/g, '').replace(/```/g, '').trim();

      return JSON.parse(outText);
    }

    // START FIRST CHAPTER
    async function startTranslateFirst() {
      const url = document.getElementById('import-url').value.trim();
      if (!url) return alert("กรุณาใส่ URL หน้านิยาย");

      const status = document.getElementById('import-status');
      const startBtn = document.getElementById('start-btn');
      const btnText = document.getElementById('start-btn-text');

      status.style.display = 'block';
      status.style.background = '#eff6ff';
      status.style.color = '#1e40af';
      status.innerText = "กำลังดึงเนื้อหาและแปลภาษา...";
      startBtn.disabled = true;
      btnText.innerText = "กำลังทำงาน...";

      try {
        currentUrl = url;
        const { text, nextUrl } = await scrapePage(url);
        nextUrlCalculated = nextUrl;

        const paragraphs = await translateText(text);
        chapters.push({
          title: `ตอนที่ ${chapters.length + 1}`,
          paragraphs: paragraphs
        });
        currentChapterIndex = chapters.length - 1;
        renderChapter();
        closeModal('import-modal');

        // Trigger Prefetch
        if (nextUrlCalculated) triggerPrefetch(nextUrlCalculated);
      } catch (err) {
        status.style.background = '#fef2f2';
        status.style.color = '#991b1b';
        status.innerText = "ข้อผิดพลาด: " + err.message;
      } finally {
        startBtn.disabled = false;
        btnText.innerText = "เริ่มแปลตอนนี้";
      }
    }

    // PREFETCH
    async function triggerPrefetch(url) {
      if (isPrefetching || !url) return;
      isPrefetching = true;
      try {
        const { text, nextUrl } = await scrapePage(url);
        const paragraphs = await translateText(text);
        prefetchedData = {
          title: `ตอนที่ ${chapters.length + 1}`,
          paragraphs: paragraphs,
          currentUrl: url,
          nextUrl: nextUrl
        };
        document.getElementById('prefetch-badge').style.display = 'inline-block';
      } catch(e) {}
      finally { isPrefetching = false; }
    }

    // NEXT CHAPTER CLICK (ONE TAP)
    async function handleNextChapterClick() {
      if (currentChapterIndex < chapters.length - 1) {
        currentChapterIndex++;
        renderChapter();
        return;
      }

      // If prefetched
      if (prefetchedData) {
        chapters.push({
          title: prefetchedData.title,
          paragraphs: prefetchedData.paragraphs
        });
        currentUrl = prefetchedData.currentUrl;
        nextUrlCalculated = prefetchedData.nextUrl;
        prefetchedData = null;
        document.getElementById('prefetch-badge').style.display = 'none';

        currentChapterIndex = chapters.length - 1;
        renderChapter();

        if (nextUrlCalculated) triggerPrefetch(nextUrlCalculated);
        return;
      }

      // If not prefetched yet, fetch on-the-fly
      if (nextUrlCalculated) {
        const btnText = document.getElementById('next-btn-text');
        btnText.innerText = "กำลังแปลตอนถัดไป...";
        document.getElementById('next-chap-btn').disabled = true;

        try {
          currentUrl = nextUrlCalculated;
          const { text, nextUrl } = await scrapePage(currentUrl);
          nextUrlCalculated = nextUrl;

          const paragraphs = await translateText(text);
          chapters.push({
            title: `ตอนที่ ${chapters.length + 1}`,
            paragraphs: paragraphs
          });
          currentChapterIndex = chapters.length - 1;
          renderChapter();

          if (nextUrlCalculated) triggerPrefetch(nextUrlCalculated);
        } catch (err) {
          alert("ไม่สามารถดึงตอนถัดไปอัตโนมัติได้: " + err.message);
          document.getElementById('import-url').value = nextUrlCalculated;
          openModal('import-modal');
        } finally {
          btnText.innerText = "ตอนถัดไป →";
          document.getElementById('next-chap-btn').disabled = false;
        }
      } else {
        openModal('import-modal');
      }
    }

    function prevChapter() {
      if (currentChapterIndex > 0) {
        currentChapterIndex--;
        renderChapter();
      }
    }

    // GLOSSARY
    function renderGlossary() {
      const list = document.getElementById('glossary-list');
      list.innerHTML = "";
      Object.entries(glossary).forEach(([k,v]) => {
        const row = document.createElement('div');
        row.style.cssText = "display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid rgba(0,0,0,0.05);";
        row.innerHTML = `<span><b>${k}</b> ➔ ${v}</span><a href="javascript:void(0)" onclick="delGloss('${k}')" style="color:red; font-weight:600; text-decoration:none;">ลบ</a>`;
        list.appendChild(row);
      });
    }

    function addGlossary() {
      const s = document.getElementById('gloss-src').value.trim();
      const t = document.getElementById('gloss-tgt').value.trim();
      if (!s || !t) return;
      glossary[s] = t;
      localStorage.setItem('nov_gloss', JSON.stringify(glossary));
      document.getElementById('gloss-src').value = "";
      document.getElementById('gloss-tgt').value = "";
      renderGlossary();
      renderChapter();
    }

    function delGloss(k) {
      delete glossary[k];
      localStorage.setItem('nov_gloss', JSON.stringify(glossary));
      renderGlossary();
      renderChapter();
    }

    // SETTINGS
    function saveSettings() {
      localStorage.setItem('nov_gemini_key', document.getElementById('gemini-key').value.trim());
      localStorage.setItem('nov_gemini_model', document.getElementById('gemini-model').value);
      closeModal('settings-modal');
      alert("บันทึกการตั้งค่าเรียบร้อยแล้ว");
    }

    function loadSettings() {
      if (localStorage.getItem('nov_gemini_key')) {
        document.getElementById('gemini-key').value = localStorage.getItem('nov_gemini_key');
      }
      if (localStorage.getItem('nov_gemini_model')) {
        document.getElementById('gemini-model').value = localStorage.getItem('nov_gemini_model');
      }
    }

    // EXPORT
    function exportTxt() {
      const chap = chapters[currentChapterIndex];
      let txt = chap.title + "\n\n";
      chap.paragraphs.forEach(p => { txt += p.th + "\n\n"; });
      const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = chap.title + ".txt";
      a.click();
    }
  </script>
</body>
</html>
