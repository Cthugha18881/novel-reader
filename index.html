<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NovelTranslate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    /* THEMES */
    body.theme-sepia { background-color: #f4ecd8; color: #2b2114; }
    body.theme-light { background-color: #f8fafc; color: #1e293b; }
    body.theme-dark  { background-color: #0d1117; color: #e6edf3; }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid rgba(0,0,0,0.08);
      backdrop-filter: blur(8px);
      background-color: inherit;
    }
    body.theme-dark header { border-bottom-color: rgba(255,255,255,0.1); }
    .brand-box { display: flex; align-items: center; gap: 8px; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: #2563eb; color: #fff; font-family: 'Kanit', sans-serif;
      font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(37,99,235,0.3);
    }
    .brand-title { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 16px; line-height: 1.2; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn {
      padding: 6px 11px; font-size: 12px; font-weight: 500;
      border-radius: 6px; border: 1px solid rgba(0,0,0,0.12);
      background: transparent; color: inherit; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      font-family: inherit;
    }
    body.theme-dark .btn { border-color: rgba(255,255,255,0.15); }
    .btn:hover { background-color: rgba(0,0,0,0.05); }
    body.theme-dark .btn:hover { background-color: rgba(255,255,255,0.08); }
    .btn-primary { background: #2563eb !important; color: #fff !important; border: none !important; }
    .btn-primary:hover { background: #1d4ed8 !important; }
    .btn-active { background: rgba(37,99,235,0.15) !important; border-color: #2563eb !important; color: #2563eb !important; font-weight: 600; }

    #prefetch-badge {
      display: none; font-size: 10px; padding: 2px 7px; border-radius: 999px;
      background: #dcfce7; color: #166534; font-weight: 600; border: 1px solid #86efac;
    }

    /* MAIN READING CANVAS */
    main {
      flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
      padding: 20px 16px 120px 16px;
    }
    @media (min-width: 768px) { main { padding-bottom: 50px; } }

    .chapter-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 10px; margin-bottom: 18px;
    }
    body.theme-dark .chapter-toolbar { border-bottom-color: rgba(255,255,255,0.1); }
    .chap-heading { font-family: 'Kanit', sans-serif; font-size: 21px; font-weight: 600; }

    /* READING PARAGRAPHS */
    #reading-content { line-height: 1.85; user-select: text; }
    .para-item { padding: 4px 6px; border-radius: 6px; margin-bottom: 6px; }

    .para-th { font-size: inherit; }
    .para-th span.term {
      font-weight: 600; color: #2563eb;
      background-color: rgba(37,99,235,0.08);
      padding: 1px 4px; border-radius: 4px;
      border: 1px solid rgba(37,99,235,0.3);
      cursor: pointer;
    }
    body.theme-dark .para-th span.term {
      color: #60a5fa; background-color: rgba(96,165,250,0.12);
      border-color: rgba(96,165,250,0.3);
    }

    /* SOURCE ORIGINAL BOX (CHINESE WORDS) */
    .para-src {
      display: none; margin-top: 6px; padding: 8px 12px;
      border-radius: 6px; font-size: 14px; opacity: 0.9;
      background: rgba(0,0,0,0.03); border-left: 3px solid #f59e0b;
      line-height: 1.8; letter-spacing: 0.5px;
    }
    body.theme-dark .para-src { background: rgba(255,255,255,0.04); }

    /* INDIVIDUAL WORD BADGE (แยกคำจีนเป็นชิ้นๆ) */
    .c-word {
      display: inline-block; padding: 0 2px; margin: 0 1px;
      border-radius: 3px; cursor: pointer; border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .c-word:hover {
      background-color: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
    }
    /* SELECTED WORD HIGHLIGHT (กรอบจางๆ เรืองแสงรอบคำที่เลือก) */
    .c-word.word-active {
      background-color: rgba(245, 158, 11, 0.25) !important;
      border-color: #d97706 !important;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.35);
      font-weight: 600;
    }

    /* CHAPTER NAVIGATION */
    .chap-nav {
      margin-top: 30px; padding-top: 18px;
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex; justify-content: space-between; align-items: center;
    }
    body.theme-dark .chap-nav { border-top-color: rgba(255,255,255,0.1); }

    /* MOBILE DOCK */
    .mobile-dock {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: inherit; border-top: 1px solid rgba(0,0,0,0.08);
      padding: 8px 12px; justify-content: space-around; align-items: center;
      backdrop-filter: blur(12px);
    }
    body.theme-dark .mobile-dock { border-top-color: rgba(255,255,255,0.1); }
    @media (min-width: 768px) { .mobile-dock { display: none; } }

    /* BOTTOM FLOATING BAR FOR WORD ADDITION */
    #selection-bar {
      display: none; position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
      z-index: 45; width: calc(100% - 32px); max-width: 440px;
      background: #1e293b; color: #fff; padding: 10px 14px; border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35); align-items: center; justify-content: space-between;
      animation: slideUp 0.15s ease-out;
    }
    @media (min-width: 768px) { #selection-bar { bottom: 25px; } }
    @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

    .sel-info { display: flex; flex-direction: column; overflow: hidden; max-width: 60%; }
    .sel-tag { font-size: 10px; opacity: 0.6; text-transform: uppercase; font-weight: 600; }
    .sel-text { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fbbf24; }

    /* MODAL WINDOWS */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex !important; }
    .modal-box {
      width: 100%; max-width: 440px; border-radius: 12px;
      padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      background-color: #fff; color: #1e293b;
    }
    body.theme-sepia .modal-box { background-color: #fbf7ee; color: #2b2114; border: 1px solid #e9dac1; }
    body.theme-dark .modal-box  { background-color: #161b22; color: #e6edf3; border: 1px solid #30363d; }

    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-title { font-family: 'Kanit', sans-serif; font-size: 16px; font-weight: 600; }
    .modal-close { background: transparent; border: none; font-size: 18px; cursor: pointer; color: inherit; opacity: 0.6; }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; opacity: 0.8; }
    .form-input {
      width: 100%; padding: 8px 10px; font-size: 13px; border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.15); outline: none; background: #fff; color: #000;
      font-family: inherit;
    }
    body.theme-dark .form-input { background: #0d1117; color: #fff; border-color: rgba(255,255,255,0.2); }
    .status-msg {
      display: none; padding: 8px 10px; border-radius: 6px; font-size: 12px;
      margin-top: 8px; line-height: 1.4;
    }
  </style>
</head>
<body class="theme-sepia" id="app-body">

  <!-- TOP HEADER -->
  <header>
    <div class="brand-box">
      <div class="brand-icon">N</div>
      <div class="brand-title">NovelTranslate AI</div>
    </div>
    <div class="header-actions">
      <div id="prefetch-badge">ตอนถัดไปพร้อม</div>
      <button class="btn btn-primary" onclick="openModal('import-modal')">+ วางลิงก์</button>
      <button class="btn" onclick="openModal('glossary-modal')">ศัพท์</button>
      <button class="btn" onclick="openModal('settings-modal')">ตั้งค่า</button>
    </div>
  </header>

  <!-- BOTTOM FLOATING ACTION BAR FOR SELECTED WORD -->
  <div id="selection-bar">
    <div class="sel-info">
      <span class="sel-tag">คำที่เลือกแตะ</span>
      <span class="sel-text" id="sel-preview-text">...</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <button class="btn" style="color:#fff; border-color:rgba(255,255,255,0.2);" onclick="clearWordSelection()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="confirmAddGlossaryFromBar()">+ เพิ่มลงคลัง</button>
    </div>
  </div>

  <!-- MAIN READING CANVAS -->
  <main>
    <div class="chapter-toolbar">
      <div>
        <h1 class="chap-heading" id="display-chap-title">ยินดีต้อนรับ</h1>
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="btn" id="toggle-all-src-btn" onclick="toggleAllSourceTexts()" title="สลับแสดงต้นฉบับทั้งหน้า">
          แสดงต้นฉบับ
        </button>
        <button class="btn" onclick="exportTxt()" style="font-size: 11px;">.TXT</button>
      </div>
    </div>

    <!-- Reading Paragraphs -->
    <div id="reading-content"></div>

    <!-- Chapter Navigation -->
    <div class="chap-nav">
      <button class="btn" onclick="prevChapter()">← ตอนก่อนหน้า</button>
      <button class="btn btn-primary" id="next-chap-btn" onclick="handleNextChapterClick()">
        <span id="next-btn-text">ตอนถัดไป →</span>
      </button>
    </div>
  </main>

  <!-- MOBILE BOTTOM DOCK -->
  <nav class="mobile-dock">
    <button class="btn" onclick="adjustFontSize(-1)">A-</button>
    <button class="btn" id="mobile-theme-btn" onclick="cycleTheme()">ถนอมสายตา</button>
    <button class="btn" onclick="adjustFontSize(1)">A+</button>
    <button class="btn" onclick="toggleAllSourceTexts()" id="mobile-src-toggle-btn">ต้นฉบับ</button>
    <button class="btn" onclick="openModal('glossary-modal')">คลังศัพท์</button>
  </nav>

  <!-- MODAL 1: IMPORT & TRANSLATE -->
  <div class="modal-overlay" id="import-modal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">วาง URL หน้านิยาย</div>
        <button class="modal-close" onclick="closeModal('import-modal')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">URL หน้านิยาย (เช่น 69shuba)</label>
        <input type="url" id="import-url" class="form-input" placeholder="https://www.69shuba.com/txt/88724/40711443">
      </div>
      <div class="status-msg" id="import-status"></div>
      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button class="btn" style="flex: 1;" onclick="closeModal('import-modal')">ยกเลิก</button>
        <button class="btn btn-primary" style="flex: 2;" id="start-btn" onclick="startTranslateFirst()">
          <span id="start-btn-text">เริ่มแปลตอนนี้</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: GLOSSARY -->
  <div class="modal-overlay" id="glossary-modal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">คลังคำศัพท์เฉพาะ (Glossary)</div>
        <button class="modal-close" onclick="closeModal('glossary-modal')">✕</button>
      </div>
      <div style="display: flex; gap: 6px; margin-bottom: 10px;">
        <input type="text" id="gloss-src" class="form-input" placeholder="คำเดิม (เช่น 林动)" style="flex: 1;">
        <input type="text" id="gloss-tgt" class="form-input" placeholder="คำแปล (เช่น หลินตง)" style="flex: 1;">
        <button class="btn btn-primary" onclick="addGlossary()">เพิ่ม</button>
      </div>
      <p style="font-size: 11px; opacity: 0.6; margin-bottom: 8px;">*แตะที่คำภาษาจีนในต้นฉบับเพื่อดึงคำมาเพิ่มเข้าคลังได้ทันทีในคลิกเดียว</p>
      <div id="glossary-list" style="max-height: 200px; overflow-y: auto; font-size: 13px;"></div>
    </div>
  </div>

  <!-- MODAL 3: SETTINGS -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">ตั้งค่าระบบและการแปล</div>
        <button class="modal-close" onclick="closeModal('settings-modal')">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">Google Gemini API Key</label>
        <input type="password" id="gemini-key" class="form-input" placeholder="AIzaSy...">
      </div>

      <div class="form-group">
        <label class="form-label">แนวเรื่อง / สไตล์สำนวนนิยาย (Genre Preset)</label>
        <select id="novel-genre" class="form-input">
          <option value="xianxia" selected>เซียนเซีย / เทพเซียนบำเพ็ญเพียร (เน้นศัพท์เต๋า ระดับลมปราณ สรรพนามข้า-เจ้า)</option>
          <option value="wuxia">กำลังภายใน / ยุทธภพ (สำนวนคลาสสิก ยุทธจักร จอมยุทธ์ ท่องใต้หล้า)</option>
          <option value="system_game">ระบบ / ดันเจี้ยน / เลเวลอัพ (กระชับ ทันสมัย หน้าต่างสเตตัสทับศัพท์)</option>
          <option value="scifi">ไซไฟ / ยุคอวกาศ (ศัพท์ดาราศาสตร์ ฟิสิกส์ เทคโนโลยีอนาคต)</option>
          <option value="horror">สยองขวัญ / ระทึกขวัญเอาชีวิตรอด (บรรยากาศกดดัน เยือกเย็น ชวนระแวง)</option>
          <option value="modern_romance">ปัจจุบัน / สืบสวน / โรแมนติก (บทสนทนาเป็นธรรมชาติ ไหลลื่น)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">โมเดล AI (Active Model)</label>
        <select id="gemini-model" class="form-input">
          <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash-Lite (แนะนำ / สปีดเร็ว ประหยัด Token)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (เรือธง / สำนวนสละสลวยที่สุด)</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        </select>
      </div>

      <div style="margin-top: 14px;">
        <button class="btn btn-primary" style="width: 100%;" onclick="saveSettings()">บันทึกการตั้งค่า</button>
      </div>
    </div>
  </div>

  <script>
    // STATE
    let currentTheme = 'sepia';
    let currentFontSize = 18;
    let currentUrl = "";
    let nextUrlCalculated = "";
    let prefetchedData = null;
    let isPrefetching = false;
    let showAllSource = false;
    let lastChapterContext = "";

    let activeSelectedWord = "";

    let glossary = {};
    try {
      glossary = JSON.parse(localStorage.getItem('nov_gloss') || '{"林动":"หลินตง","九品":"ขั้นเก้า"}');
    } catch(e) { glossary = {}; }

    let chapters = [
      {
        title: "คู่มือเริ่มต้น",
        paragraphs: [
          { th: "ยินดีต้อนรับสู่ NovelTranslate AI", src: "欢迎来到 NovelTranslate" },
          { th: "1. แตะที่ย่อหน้าเพื่อกางดูภาษาจีน หรือกดปุ่ม 'แสดงต้นฉบับ' ด้านบน", src: "点击段落即可查看原文" },
          { th: "2. ในภาษาต้นฉบับ ข้อความถูกแยกเป็นคำๆ ไว้แล้ว แตะที่คำใดก็ได้จะมีกรอบจางๆ ล้อมรอบคำนั้นทันที", src: "点击任何中文词语都会高亮" }
        ]
      }
    ];
    let currentChapterIndex = 0;

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      renderChapter();
      renderGlossary();
    });

    // THEME & FONT
    function cycleTheme() {
      const themes = ['sepia', 'light', 'dark'];
      currentTheme = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
      document.getElementById('app-body').className = 'theme-' + currentTheme;
      document.getElementById('mobile-theme-btn').innerText = 
        currentTheme === 'sepia' ? 'ถนอมสายตา' : (currentTheme === 'light' ? 'สว่าง' : 'มืด');
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.min(26, Math.max(14, currentFontSize + delta));
      document.getElementById('reading-content').style.fontSize = currentFontSize + 'px';
    }

    function toggleAllSourceTexts() {
      showAllSource = !showAllSource;
      const btn = document.getElementById('toggle-all-src-btn');
      const mobileBtn = document.getElementById('mobile-src-toggle-btn');
      
      if (showAllSource) {
        btn.classList.add('btn-active');
        btn.innerText = "ซ่อนต้นฉบับ";
        if (mobileBtn) mobileBtn.classList.add('btn-active');
      } else {
        btn.classList.remove('btn-active');
        btn.innerText = "แสดงต้นฉบับ";
        if (mobileBtn) mobileBtn.classList.remove('btn-active');
      }

      document.querySelectorAll('.para-src').forEach(el => {
        el.style.display = showAllSource ? 'block' : 'none';
      });
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // CHINESE WORD SEGMENTATION (แยกคำภาษาจีนด้วย Intl.Segmenter)
    function segmentChineseText(text) {
      if (!text) return "";
      
      // ตรวจสอบว่าเบราว์เซอร์รองรับ Intl.Segmenter สำหรับตัดคำจีนหรือไม่
      if (window.Intl && Intl.Segmenter) {
        try {
          const segmenter = new Intl.Segmenter('zh-CN', { granularity: 'word' });
          const segments = segmenter.segment(text);
          let html = "";
          for (let seg of segments) {
            const w = seg.segment;
            // ถ้าเป็นเครื่องหมายวรรคตอนหรือเว้นวรรค ไม่ต้องห่อ
            if (/^[\s\p{P}]+$/u.test(w)) {
              html += w;
            } else {
              html += `<span class="c-word" onclick="handleWordClick(event, '${escapeQuotes(w)}')">${w}</span>`;
            }
          }
          return html;
        } catch(e) {}
      }

      // Fallback: หากเบราว์เซอร์เก่าไม่รองรับ ให้แยกตามตัวอักษร
      return text.split('').map(char => {
        if (/[\u4e00-\u9fa5]/.test(char)) {
          return `<span class="c-word" onclick="handleWordClick(event, '${escapeQuotes(char)}')">${char}</span>`;
        }
        return char;
      }).join('');
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // แตะที่คำจีน: ไฮไลต์กรอบจางๆ รอบคำ และเปิดแถบลอยด้านล่างทันที
    function handleWordClick(event, word) {
      event.stopPropagation(); // ไม่ให้ย่อหน้ายุบหรือขยาย

      // ปลดกรอบไฮไลต์คำเดิม
      document.querySelectorAll('.c-word.word-active').forEach(el => el.classList.remove('word-active'));

      // ใส่กรอบไฮไลต์คำที่แตะ
      event.target.classList.add('word-active');

      activeSelectedWord = word;

      // แสดงแถบด้านล่าง
      const bar = document.getElementById('selection-bar');
      const preview = document.getElementById('sel-preview-text');
      preview.innerText = word;
      bar.style.display = 'flex';
    }

    function clearWordSelection() {
      document.querySelectorAll('.c-word.word-active').forEach(el => el.classList.remove('word-active'));
      document.getElementById('selection-bar').style.display = 'none';
      activeSelectedWord = "";
    }

    function confirmAddGlossaryFromBar() {
      if (!activeSelectedWord) return;
      document.getElementById('selection-bar').style.display = 'none';

      document.getElementById('gloss-src').value = activeSelectedWord;
      document.getElementById('gloss-tgt').value = "";

      openModal('glossary-modal');
      setTimeout(() => {
        document.getElementById('gloss-tgt').focus();
      }, 150);
    }

    // RENDER CONTENT WITH WORD-LEVEL HIGHLIGHTING
    function renderChapter() {
      const chap = chapters[currentChapterIndex];
      document.getElementById('display-chap-title').innerText = chap.title;

      const container = document.getElementById('reading-content');
      container.innerHTML = "";
      container.style.fontSize = currentFontSize + 'px';

      chap.paragraphs.forEach((p, idx) => {
        const pEl = document.createElement('div');
        pEl.className = 'para-item';
        pEl.id = `para-box-${idx}`;

        // จัดรูปแบบคำแปลภาษาไทย + ไฮไลต์คำในคลังศัพท์
        let thText = String(p.th || "");
        Object.values(glossary).forEach(name => {
          if (name && typeof name === 'string' && name.trim()) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            thText = thText.replace(new RegExp(`(${escaped})`, 'g'), '<span class="term" title="คำเฉพาะในคลัง">$1</span>');
          }
        });

        // ตัดคำภาษาจีนรายคำ
        const segmentedSrc = segmentChineseText(p.src || '');

        pEl.innerHTML = `
          <div class="para-th" onclick="toggleParagraphSrc(${idx})">${thText}</div>
          <div class="para-src" id="src-${idx}" style="display: ${showAllSource ? 'block' : 'none'};">${segmentedSrc}</div>
        `;
        container.appendChild(pEl);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleParagraphSrc(idx) {
      if (showAllSource) return;
      const srcEl = document.getElementById(`src-${idx}`);
      if (srcEl) {
        srcEl.style.display = (srcEl.style.display === 'block') ? 'none' : 'block';
      }
    }

    // SCRAPER ENGINE
    async function scrapePage(url) {
      let rawText = "";
      try {
        const res = await fetch(`https://r.jina.ai/${url}`);
        if (res.ok) {
          const md = await res.text();
          const lines = md.split('\n').map(l => l.trim()).filter(l => l.length > 10 && !l.startsWith('!') && !l.startsWith('['));
          rawText = lines.slice(0, 35).join('\n\n');
        }
      } catch (e) {}

      if (!rawText || rawText.length < 50) {
        const pRes = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const pData = await pRes.json();
        if (pData.contents) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(pData.contents, 'text/html');
          const paras = [];
          doc.querySelectorAll('article p, .content p, #content, .txtnav, p').forEach(el => {
            const t = el.innerText ? el.innerText.trim() : '';
            if (t.length > 20) paras.push(t);
          });
          rawText = paras.slice(0, 35).join('\n\n');
        }
      }

      if (!rawText || rawText.length < 30) throw new Error("ไม่สามารถดึงข้อความจากเว็บนี้ได้");

      let nextUrl = null;
      const numMatch = url.match(/^(.*?)(\d+)(\.html?|\/)?$/);
      if (numMatch) {
        const prefix = numMatch[1];
        const num = numMatch[2];
        const suffix = numMatch[3] || '';
        const nextNum = (parseInt(num, 10) + 1).toString();
        nextUrl = prefix + nextNum + suffix;
      }

      return { text: rawText, nextUrl: nextUrl };
    }

    // GENRE RULES
    function getGenreInstruction(genre) {
      switch (genre) {
        case 'xianxia':
          return `สไตล์: "เทพเซียน / บำเพ็ญเพียร (Xianxia)"
- ใช้สรรพนาม: "ข้า - เจ้า", "ผู้อาวุโส - ศิษย์น้อง/ผู้น้อย" ห้ามหลุด "ฉัน/นาย/คุณ/ผม" เด็ดขาด
- ศัพท์เต๋า: บำเพ็ญเพียร, ลมปราณ, แก่นทองคำ, ทัณฑ์สวรรค์, ตำหนัก, ยอดเขา`;
        case 'wuxia':
          return `สไตล์: "กำลังภายใน / ยุทธภพ (Wuxia)"
- บรรยากาศยุทธจักร: สำนัก, คัมภีร์ยุทธ, ปราณคุ้มกาย, กระบี่, ท่องยุทธภพ
- สรรพนามคลาสสิก: "ข้า - ท่าน/เจ้า"`;
        case 'system_game':
          return `สไตล์: "ระบบ / ดันเจี้ยน / ผู้เล่น (System/Game)"
- ข้อความแจ้งเตือน: [ติ๊ง! ตรวจพบภารกิจ], [เลเวลอัป]
- สรรพนามทันสมัย: "ฉัน - นาย"`;
        case 'scifi':
          return `สไตล์: "ไซไฟ / มหากาพย์อวกาศ (Sci-Fi)"
- ศัพท์วิทยาศาสตร์: ยานรบ, รูหนอน, วาร์ป, คลื่นแม่เหล็ก, พันธุกรรม`;
        case 'horror':
          return `สไตล์: "สยองขวัญ / เอาชีวิตรอด (Horror)"
- เน้นบรรยายบรรยากาศ: วังเวง, เย็นเยียบ, เสียงลมหายใจ, กลิ่นคาว, เงาตะคุ่ม`;
        default:
          return `สไตล์: วรรณกรรมทั่วไป อ่านลื่นไหลเป็นธรรมชาติ`;
      }
    }

    // TRANSLATE
    async function translateText(rawText) {
      const key = (localStorage.getItem('nov_gemini_key') || "").trim();
      const model = (localStorage.getItem('nov_gemini_model') || "gemini-3.5-flash-lite").trim();
      const genre = localStorage.getItem('nov_genre') || "xianxia";

      if (!key) throw new Error("กรุณาใส่ API Key ในเมนู 'ตั้งค่า' ก่อน");

      const termList = Object.entries(glossary).map(([k,v]) => `${k}=${v}`).join(", ");
      const genreRule = getGenreInstruction(genre);

      const prompt = `คุณคือนักแปลนิยายมืออาชีพ แปลเนื้อหาต่อไปนี้เป็นภาษาไทยให้อ่านสนุก ไหลลื่น สละสลวย

${genreRule}

ข้อบังคับสำคัญ:
1. คำศัพท์เฉพาะที่ต้องล็อกคำแปล 100%: [${termList}]
2. ล็อกสรรพนามของตัวละครให้สอดคล้องกัน ห้ามสลับไปมา
${lastChapterContext ? `3. บริบทตอนก่อนหน้า: "${lastChapterContext}"` : ''}

ตอบกลับเฉพาะรูปแบบ JSON Array: [{"th": "คำแปลไทย", "src": "ข้อความต้นฉบับ"}] ไม่ต้องใส่ Markdown`;

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: `${prompt}\n\nเนื้อหา:\n${rawText.substring(0, 4800)}` }] }]
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || "ยิง API ไม่สำเร็จ");

      let outText = data.candidates[0].content.parts[0].text;
      const jsonMatch = outText.match(/\[\s*\{[\s\S]*\}\s*\]/);
      if (jsonMatch) outText = jsonMatch[0];
      else outText = outText.replace(/```json/g, '').replace(/```/g, '').trim();

      const parsedResult = JSON.parse(outText);

      if (parsedResult.length > 0) {
        const lastTwo = parsedResult.slice(-2).map(item => item.th).join(" ");
        lastChapterContext = lastTwo.substring(0, 150);
      }

      return parsedResult;
    }

    // START FIRST CHAPTER
    async function startTranslateFirst() {
      const url = document.getElementById('import-url').value.trim();
      if (!url) return alert("กรุณาใส่ URL หน้านิยาย");

      const status = document.getElementById('import-status');
      const startBtn = document.getElementById('start-btn');
      const btnText = document.getElementById('start-btn-text');

      status.style.display = 'block';
      status.style.background = '#eff6ff';
      status.style.color = '#1e40af';
      status.innerText = "กำลังดึงเนื้อหาและแปลตามสำนวนที่เลือก...";
      startBtn.disabled = true;
      btnText.innerText = "กำลังทำงาน...";

      try {
        currentUrl = url;
        lastChapterContext = "";
        const { text, nextUrl } = await scrapePage(url);
        nextUrlCalculated = nextUrl;

        const paragraphs = await translateText(text);
        chapters.push({
          title: `ตอนที่ ${chapters.length + 1}`,
          paragraphs: paragraphs
        });
        currentChapterIndex = chapters.length - 1;
        renderChapter();
        closeModal('import-modal');

        if (nextUrlCalculated) triggerPrefetch(nextUrlCalculated);
      } catch (err) {
        status.style.background = '#fef2f2';
        status.style.color = '#991b1b';
        status.innerText = "ข้อผิดพลาด: " + err.message;
      } finally {
        startBtn.disabled = false;
        btnText.innerText = "เริ่มแปลตอนนี้";
      }
    }

    // PREFETCH
    async function triggerPrefetch(url) {
      if (isPrefetching || !url) return;
      isPrefetching = true;
      try {
        const { text, nextUrl } = await scrapePage(url);
        const paragraphs = await translateText(text);
        prefetchedData = {
          title: `ตอนที่ ${chapters.length + 1}`,
          paragraphs: paragraphs,
          currentUrl: url,
          nextUrl: nextUrl
        };
        document.getElementById('prefetch-badge').style.display = 'inline-block';
      } catch(e) {}
      finally { isPrefetching = false; }
    }

    // NEXT CHAPTER CLICK
    async function handleNextChapterClick() {
      if (currentChapterIndex < chapters.length - 1) {
        currentChapterIndex++;
        renderChapter();
        return;
      }

      if (prefetchedData) {
        chapters.push({
          title: prefetchedData.title,
          paragraphs: prefetchedData.paragraphs
        });
        currentUrl = prefetchedData.currentUrl;
        nextUrlCalculated = prefetchedData.nextUrl;
        prefetchedData = null;
        document.getElementById('prefetch-badge').style.display = 'none';

        currentChapterIndex = chapters.length - 1;
        renderChapter();

        if (nextUrlCalculated) triggerPrefetch(nextUrlCalculated);
        return;
      }

      if (nextUrlCalculated) {
        const btnText = document.getElementById('next-btn-text');
        btnText.innerText = "กำลังแปลตอนถัดไป...";
        document.getElementById('next-chap-btn').disabled = true;

        try {
          currentUrl = nextUrlCalculated;
          const { text, nextUrl } = await scrapePage(currentUrl);
          nextUrlCalculated = nextUrl;

          const paragraphs = await translateText(text);
          chapters.push({
            title: `ตอนที่ ${chapters.length + 1}`,
            paragraphs: paragraphs
          });
          currentChapterIndex = chapters.length - 1;
          renderChapter();

          if (nextUrlCalculated) triggerPrefetch(nextUrlCalculated);
        } catch (err) {
          alert("ไม่สามารถดึงตอนถัดไปอัตโนมัติได้: " + err.message);
          document.getElementById('import-url').value = nextUrlCalculated;
          openModal('import-modal');
        } finally {
          btnText.innerText = "ตอนถัดไป →";
          document.getElementById('next-chap-btn').disabled = false;
        }
      } else {
        openModal('import-modal');
      }
    }

    function prevChapter() {
      if (currentChapterIndex > 0) {
        currentChapterIndex--;
        renderChapter();
      }
    }

    // GLOSSARY MANAGEMENT
    function renderGlossary() {
      const list = document.getElementById('glossary-list');
      list.innerHTML = "";
      Object.entries(glossary).forEach(([k,v]) => {
        const row = document.createElement('div');
        row.style.cssText = "display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid rgba(0,0,0,0.05);";
        row.innerHTML = `<span><b>${k}</b> ➔ ${v}</span><a href="javascript:void(0)" onclick="delGloss('${k}')" style="color:red; font-weight:600; text-decoration:none;">ลบ</a>`;
        list.appendChild(row);
      });
    }

    function addGlossary() {
      const s = document.getElementById('gloss-src').value.trim();
      const t = document.getElementById('gloss-tgt').value.trim();
      if (!s || !t) return;
      glossary[s] = t;
      localStorage.setItem('nov_gloss', JSON.stringify(glossary));
      document.getElementById('gloss-src').value = "";
      document.getElementById('gloss-tgt').value = "";
      renderGlossary();
      renderChapter();
    }

    function delGloss(k) {
      delete glossary[k];
      localStorage.setItem('nov_gloss', JSON.stringify(glossary));
      renderGlossary();
      renderChapter();
    }

    // SETTINGS
    function saveSettings() {
      localStorage.setItem('nov_gemini_key', document.getElementById('gemini-key').value.trim());
      localStorage.setItem('nov_gemini_model', document.getElementById('gemini-model').value);
      localStorage.setItem('nov_genre', document.getElementById('novel-genre').value);
      closeModal('settings-modal');
      alert("บันทึกการตั้งค่าเรียบร้อยแล้ว");
    }

    function loadSettings() {
      if (localStorage.getItem('nov_gemini_key')) {
        document.getElementById('gemini-key').value = localStorage.getItem('nov_gemini_key');
      }
      if (localStorage.getItem('nov_gemini_model')) {
        document.getElementById('gemini-model').value = localStorage.getItem('nov_gemini_model');
      }
      if (localStorage.getItem('nov_genre')) {
        document.getElementById('novel-genre').value = localStorage.getItem('nov_genre');
      }
    }

    // EXPORT
    function exportTxt() {
      const chap = chapters[currentChapterIndex];
      let txt = chap.title + "\n\n";
      chap.paragraphs.forEach(p => { txt += p.th + "\n\n"; });
      const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = chap.title + ".txt";
      a.click();
    }
  </script>
