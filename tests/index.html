<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelTranslate Unit Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f8fafc; color: #1e293b; }
    h1 { font-size: 18px; }
    #summary { font-weight: 600; margin: 8px 0 16px; }
    .pass { color: #166534; } .fail { color: #b91c1c; }
    li { font-family: ui-monospace, monospace; font-size: 13px; margin: 2px 0; word-break: break-word; }
  </style>
</head>
<body>
  <h1>NovelTranslate — Unit Tests</h1>
  <div id="summary">กำลังรัน...</div>
  <ul id="results"></ul>

  <script>
    // ตัวแปร global ที่ปกติประกาศใน app.js (หน้านี้ไม่โหลด app.js)
    var currentBookId = 'book_test', currentBookTitle = 'เรื่องทดสอบ', currentAuthor = '', currentBookGenre = 'xianxia', chapters = [];
  </script>
  <script src="../js/db.js"></script>
  <script src="../js/safety.js"></script>
  <script src="../js/llm.js"></script>
  <script src="../js/usage.js"></script>
  <script src="../js/lang.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/source.js"></script>
  <script src="../js/cleanup.js"></script>
  <script src="../js/glossary.js"></script>
  <script src="../js/bible.js"></script>
  <script src="../js/storylog.js"></script>
  <script src="../js/shelf.js"></script>
  <script src="../js/updates.js"></script>
  <script src="../js/assistant.js"></script>
  <script src="../js/reader.js"></script>
  <script src="../js/bgm.js"></script>
  <script src="../js/export.js"></script>
  <script>
    const results = [];
    function test(name, fn) {
      try {
        const out = fn();
        results.push({ name, ok: out !== false, detail: out === false ? 'returned false' : '' });
      } catch (err) {
        results.push({ name, ok: false, detail: err.message });
      }
    }
    function eq(actual, expected) {
      const a = JSON.stringify(actual), e = JSON.stringify(expected);
      if (a !== e) throw new Error(`expected ${e} got ${a}`);
      return true;
    }

    // ---------- URL / scraper ----------
    test('computeNextNumericUrl: เลขท้าย URL +1', () => eq(computeNextNumericUrl('https://www.69shuba.com/txt/88724/40717272'), 'https://www.69shuba.com/txt/88724/40717273'));
    test('computeNextNumericUrl: คงเลข 0 นำหน้าและนามสกุล', () => eq(computeNextNumericUrl('https://x.test/b/0099.html'), 'https://x.test/b/0100.html'));
    test('computeNextNumericUrl: ไม่มีตัวเลข', () => eq(computeNextNumericUrl('https://x.test/abc'), null));

    test('extractNavLinks: หา "下一章" และแปลงเป็น URL เต็ม', () => {
      const md = '[上一章](/book/1/100.html) [目录](/book/1/) [下一章 →](/book/1/105.html)';
      return eq(extractNavLinks(md, 'https://x.test/book/1/101.html'), { nextChapter: 'https://x.test/book/1/105.html', nextPage: null });
    });
    test('extractNavLinks: "下一页" แยกจาก "下一章"', () => {
      const md = '[下一页](https://x.test/b/101_2.html)\n[下一章](https://x.test/b/102.html)';
      return eq(extractNavLinks(md, 'https://x.test/b/101.html'), { nextChapter: 'https://x.test/b/102.html', nextPage: 'https://x.test/b/101_2.html' });
    });
    test('extractNavLinks: ข้ามลิงก์ที่ชี้กลับหน้าเดิม', () => eq(extractNavLinks('[下一章](https://x.test/b/1.html)', 'https://x.test/b/1.html').nextChapter, null));

    test('isContinuationPage: 123.html -> 123_2.html', () => isContinuationPage('https://x.test/a/123.html', 'https://x.test/a/123_2.html'));
    test('isContinuationPage: 123_2 -> 123_3', () => isContinuationPage('https://x.test/a/123.html', 'https://x.test/a/123_3.html'));
    test('isContinuationPage: 123 -> 124 ไม่ใช่หน้าต่อ', () => !isContinuationPage('https://x.test/a/123.html', 'https://x.test/a/124.html'));
    test('isContinuationPage: ต่างโฟลเดอร์ไม่ใช่หน้าต่อ', () => !isContinuationPage('https://x.test/a/123.html', 'https://x.test/b/123_2.html'));

    test('parseJinaMarkdown: ตัดบรรทัดเมนูนำทางและดึงชื่อ/ผู้แต่ง', () => {
      const md = [
        'Title: 我的书-第5章 风起-69书吧',
        'URL Source: https://x.test/txt/1/5',
        'Markdown Content:',
        '作者：张三',
        '上一章 ← [目录](https://x.test/txt/1/) → [下一章](https://x.test/txt/1/6)',
        '他抬头看向天空。',
        '',
        '风起云涌。'
      ].join('\n');
      const r = parseJinaMarkdown(md, 'https://x.test/txt/1/5');
      eq(r.rawBookTitle, '我的书');
      eq(r.author, '张三');
      eq(r.nav.nextChapter, 'https://x.test/txt/1/6');
      if (r.text.includes('目录')) throw new Error('nav line leaked into text: ' + r.text);
      return r.text.includes('他抬头看向天空') && r.text.includes('风起云涌');
    });

    // ---------- JSON parsing ----------
    test('cleanAndParseJSON: trailing comma + newline ดิบใน string', () => eq(cleanAndParseJSON('```json\n{"a":"x\ny",}\n```'), { a: 'x\ny' }));
    test('cleanAndParseJSON: กู้ย่อหน้าแบบมีหมายเลขจาก JSON ที่ถูกตัด', () => {
      const r = cleanAndParseJSON('{"translatedChapterTitle":"บทที่ 1","paragraphs":[{"i":0,"th":"หนึ่ง"},{"i":1,"th":"สอง \\"คำพูด\\""},{"i":2,"th":"สา');
      eq(r.translatedChapterTitle, 'บทที่ 1');
      return eq(r.paragraphs, [{ i: 0, th: 'หนึ่ง' }, { i: 1, th: 'สอง "คำพูด"' }]) && r._partial === true;
    });
    test('cleanAndParseJSON: JSON เสียหมดโยน error', () => { try { cleanAndParseJSON('not json'); return false; } catch (e) { return true; } });

    // ---------- Chunking / glossary filter ----------
    test('splitSourceParagraphs: แยกตามบรรทัดว่าง', () => eq(splitSourceParagraphs('甲\n\n乙\n\n\n丙 '), ['甲', '乙', '丙']));
    test('chunkParagraphs: แบ่งตามจำนวนอักษร', () => {
      const items = [{ i: 0, src: 'a'.repeat(60) }, { i: 1, src: 'b'.repeat(60) }, { i: 2, src: 'c'.repeat(30) }];
      return eq(chunkParagraphs(items, 100).map(c => c.map(x => x.i)), [[0], [1, 2]]);
    });
    test('chunkParagraphs: ย่อหน้าเดียวที่ยาวเกินยังอยู่ในชุดของตัวเอง', () => eq(chunkParagraphs([{ i: 0, src: 'x'.repeat(500) }], 100).length, 1));
    test('buildRelevantTermList: ส่งเฉพาะคำที่อยู่ในบท เรียงคำยาวก่อน', () => {
      const terms = { '林': { resolvedTgt: 'หลิน' }, '林动': { resolvedTgt: 'หลินต้ง' }, '萧炎': { resolvedTgt: 'เซียวเหยียน' } };
      return eq(buildRelevantTermList(terms, '林动说'), '林动=หลินต้ง, 林=หลิน');
    });

    // ---------- Suspicious paragraph detection ----------
    test('findSuspiciousParagraphs: จับอักษรจีนหลุด/วงเล็บว่าง/ไม่ใช้คำในคลัง', () => {
      const terms = { '林动': { resolvedTgt: 'หลินต้ง' } };
      const paras = [
        { src: '林动走进了大殿，抬头看了看四周的人群。', th: 'หลินต้งเดินเข้าไปในท้องพระโรง เงยหน้ามองฝูงชนรอบตัว' },
        { src: '林动走进了大殿，抬头看了看四周的人群。', th: 'หลินตงเดินเข้าไปในท้องพระโรง เงยหน้ามองฝูงชนรอบตัว' },
        { src: '他说道，这是【大海水】的力量啊啊啊。', th: 'เขากล่าวว่า นี่คือพลังของ【 】' },
        { src: '天空中出现了一道金光，照亮了整片大地。', th: 'บนท้องฟ้าปรากฏแสง金ทองสาดส่องผืนแผ่นดินทั้งหมด' }
      ];
      return eq(findSuspiciousParagraphs(paras, terms), [1, 2, 3]);
    });
    test('findSuspiciousParagraphs: คำแปลสั้นผิดปกติ', () => eq(findSuspiciousParagraphs([{ src: '这是一个非常非常长的中文句子需要好好翻译。', th: 'สั้น' }], {}), [0]));

    // ---------- Schema conversion ----------
    test('toGeminiSchema: ตัวพิมพ์ใหญ่ + propertyOrdering + ตัด additionalProperties', () => {
      const g = toGeminiSchema(SCHEMAS.research);
      eq(g.type, 'OBJECT');
      eq(g.propertyOrdering, ['tgt', 'category']);
      eq(g.properties.category.enum.length, 7);
      return !('additionalProperties' in g);
    });
    test('SCHEMAS: ทุก object มี required ครบตาม properties (OpenAI strict)', () => {
      const walk = (s) => {
        if (s.type === 'object') {
          eq([...s.required].sort(), Object.keys(s.properties).sort());
          if (s.additionalProperties !== false) throw new Error('missing additionalProperties:false');
          Object.values(s.properties).forEach(walk);
        }
        if (s.items) walk(s.items);
      };
      Object.values(SCHEMAS).forEach(walk);
      return true;
    });

    // ---------- Misc ----------
    test('rescueEmptyBrackets: เติมคำจีนเดิมเมื่อวงเล็บว่าง', () => eq(rescueEmptyBrackets('พลังของ【 】', 'X【大海水】Y'), 'พลังของ【大海水】'));
    test('cleanThaiOutput: ตัดขีด —— นำหน้า', () => eq(cleanThaiOutput('——ไปกันเถอะ\n——ได้เลย', ''), 'ไปกันเถอะ\nได้เลย'));
    test('resolveTermForBook: override เฉพาะเรื่อง', () => {
      const item = { src: '林', tgt: 'หลิน', overrides: { book_b: 'ลิ่ม' } };
      return eq([resolveTermForBook(item, 'book_a'), resolveTermForBook(item, 'book_b')], ['หลิน', 'ลิ่ม']);
    });
    test('applyInlineTermHighlighting: escape HTML แม้ไม่มีคำศัพท์', () => eq(applyInlineTermHighlighting('<b>x</b>', {}), '&lt;b&gt;x&lt;/b&gt;'));
    test('applyInlineTermHighlighting: ไม่ไฮไลต์คำ 1 ตัวอักษร', () => !applyInlineTermHighlighting('ก ข', { '甲': { src: '甲', resolvedTgt: 'ก' } }).includes('inline-term-highlight'));
    test('isMissingPageError: 404 จาก AI ไม่นับเป็นหน้าเว็บหาย', () => !isMissingPageError(new LLMError('คำขอไม่ถูกต้อง (404): model not found', 'bad_request', 404)) && isMissingPageError(new Error('404')));
    test('xmlEscape: escape และตัดอักขระควบคุม', () => eq(xmlEscape('a&<b>"\u0001'), 'a&amp;&lt;b&gt;&quot;'));
    test('getVerifyMode: ค่าเก่า false -> off', () => {
      const keys = ['nov_quality_mode', 'nov_verify_mode', 'nov_enable_bilingual_verify'];
      const saved = keys.map(k => [k, localStorage.getItem(k)]);
      localStorage.removeItem('nov_quality_mode');
      localStorage.removeItem('nov_verify_mode');
      localStorage.setItem('nov_enable_bilingual_verify', 'false');
      const r = getVerifyMode();
      saved.forEach(([k, v]) => v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v));
      return eq(r, 'off');
    });

    // ---------- Phase 1: URL identity ----------
    test('normalizeUrl: ไม่สน https/www/m./slash/hash/utm', () => {
      const a = normalizeUrl('https://www.69shuba.com/txt/1/2/?utm_source=x#top');
      const b = normalizeUrl('http://m.69shuba.com/txt/1/2');
      return eq(a, b) && eq(a, '69shuba.com/txt/1/2');
    });
    test('normalizeUrl: query ที่มีความหมายยังต่างกัน', () => normalizeUrl('https://s.test/read.php?bid=1&cid=2') !== normalizeUrl('https://s.test/read.php?bid=1&cid=3'));
    test('normalizeUrl: ลำดับ query ไม่มีผล', () => eq(normalizeUrl('https://s.test/r?b=1&a=2'), normalizeUrl('https://s.test/r?a=2&b=1')));
    test('sameSourceUrl', () => sameSourceUrl('https://x.test/a/1.html', 'http://www.x.test/a/1.html') && !sameSourceUrl('https://x.test/a/1.html', 'https://x.test/a/2.html') && !sameSourceUrl('', ''));

    test('bookId: 69shuba ใช้ id เดิม (เข้ากับข้อมูลเก่า)', () => eq(extractBookIdFromUrl('https://www.69shuba.com/txt/88724/40717272'), 'book_88724'));
    test('bookId: /book/123/456.html ใช้ id เดิม', () => eq(extractBookIdFromUrl('https://www.biquge.test/book/123/456.html'), 'book_123'));
    const sameBook = (a, b) => extractBookIdFromUrl(a) === extractBookIdFromUrl(b);
    test('bookId: syosetu ตอนต่างกันเรื่องเดียวกัน', () => sameBook('https://ncode.syosetu.com/n1234ab/5/', 'https://ncode.syosetu.com/n1234ab/6/'));
    test('bookId: syosetu คนละเรื่องได้คนละ id (บั๊กเดิมรวมเป็นเรื่องเดียว)', () => !sameBook('https://ncode.syosetu.com/n1234ab/5/', 'https://ncode.syosetu.com/n9999zz/5/'));
    test('bookId: kakuyomu /works/X/episodes/Y', () => sameBook('https://kakuyomu.jp/works/111/episodes/222', 'https://kakuyomu.jp/works/111/episodes/333') && !sameBook('https://kakuyomu.jp/works/111/episodes/222', 'https://kakuyomu.jp/works/999/episodes/222'));
    test('bookId: royalroad /fiction/X/slug/chapter/Y/slug', () => sameBook('https://www.royalroad.com/fiction/123/my-story/chapter/1/one', 'https://www.royalroad.com/fiction/123/my-story/chapter/2/two'));
    test('bookId: query bid=', () => sameBook('https://s.test/read.php?bid=5&cid=1', 'https://s.test/read.php?bid=5&cid=2') && !sameBook('https://s.test/read.php?bid=5&cid=1', 'https://s.test/read.php?bid=6&cid=1'));
    test('bookId: http/https และ m. ได้เรื่องเดียวกัน', () => sameBook('https://m.site.test/novel/abc/1.html', 'http://www.site.test/novel/abc/2.html'));
    test('deriveBookKey: site.com/123.html แยกเรื่องไม่ได้ -> reliable=false', () => deriveBookKey('https://site.test/123.html').reliable === false);
    test('bookId: URL ที่แยกเรื่องไม่ได้ ไม่รวมทุกตอนของเว็บเป็นเรื่องเดียว', () => !sameBook('https://site.test/123.html', 'https://site.test/456.html'));
    test('findExistingBookForUrl: หาเรื่องเก่า (id รุ่นเก่า) จาก lastUrl', () => {
      const books = [{ bookId: 'book_aHR0cHMlM0ElMkYl', title: 'เก่า', lastUrl: 'https://ncode.syosetu.com/n1234ab/9/' }];
      return eq(findExistingBookForUrl('https://ncode.syosetu.com/n1234ab/10/', books)?.title, 'เก่า') && findExistingBookForUrl('https://ncode.syosetu.com/n0000aa/10/', books) === null;
    });
    test('findExistingBookForUrl: ใช้ sourceKey ที่บันทึกไว้', () => {
      const books = [{ bookId: 'book_x', title: 'K', sourceKey: 'kakuyomu.jp/works/111' }];
      return eq(findExistingBookForUrl('https://kakuyomu.jp/works/111/episodes/5', books)?.bookId, 'book_x');
    });

    // ---------- Phase 1: data defaults & backup ----------
    test('normalizeChapter: ตอนเก่าได้ค่า default', () => {
      const c = normalizeChapter({ id: 'a', bookId: 'b' });
      return eq([c.chapterType, c.paragraphs], ['story', []]);
    });
    test('getBookSourceLang / getTermLang default zh', () => eq([getBookSourceLang({}), getTermLang({}), getBookSourceLang({ sourceLang: 'ja' })], ['zh', 'zh', 'ja']));
    test('isValidBackup: รับไฟล์ v1 (ไม่มี bookData)', () => isValidBackup({ format: 'NovelTranslateBackup', version: 1, books: [], chapters: [], glossaries: [] }));
    test('isValidBackup: ปฏิเสธไฟล์จากรุ่นที่ใหม่กว่า', () => !isValidBackup({ format: 'NovelTranslateBackup', version: 99, books: [], chapters: [], glossaries: [] }));
    test('upgradeBackup: v1 -> ปัจจุบัน เติม bookData และ default ของตอน', () => {
      const up = upgradeBackup({ format: 'NovelTranslateBackup', version: 1, books: [{ bookId: 'b' }, null], chapters: [{ id: 'c', bookId: 'b' }], glossaries: [{ src: 'x', tgt: 'เอ็กซ์' }] });
      return eq([up.version, up.bookData, up.books.length, up.chapters[0].chapterType, up.glossaries.length], [BACKUP_VERSION, [], 1, 'story', 1]);
    });
    test('buildChapterRecord: มี translationMeta และ chapterType', () => {
      const rec = buildChapterRecord({ bookId: 'b', order: 3, title: 't', result: { paragraphs: [{ th: 'ก', src: '甲' }], summary: 's' }, sourceUrl: 'u', nextUrl: 'n' });
      return eq([rec.bookId, rec.order, rec.chapterType, rec.translationMeta.promptVersion, typeof rec.translationMeta.translatedAt], ['b', 3, 'story', PROMPT_VERSION, 'number']);
    });

    // ---------- Phase 2: content classification ----------
    test('classify: ตอนกันก๊อป (防盗)', () => eq(classifyChapterByRules('第12章 风起', '本章为防盗章节，稍后替换为正文。' + '废话'.repeat(30)).type, 'placeholder'));
    test('classify: ตอนยาวที่มีคำ 防盗 ท้ายเรื่องไม่ถือเป็นกันก๊อป', () => eq(classifyChapterByRules('第12章 风起', '正文'.repeat(1700) + '防盗').type, 'story'));
    test('classify: ประกาศลาหยุด (ไม่มีเลขตอน) = author_note high', () => eq(classifyChapterByRules('请假条', '今天身体不适，请假一天。'), { type: 'author_note', confidence: 'high', reason: 'note-title' }));
    test('classify: ชื่อมีเลขตอน + คำประกาศ = low (ให้ AI ตัดสิน)', () => eq(classifyChapterByRules('第100章 上架感言', '正文'.repeat(10)).confidence, 'low'));
    test('classify: 番外 = side_story', () => eq(classifyChapterByRules('番外一 童年', '正文').type, 'side_story'));
    test('classify: ตอนปกติ = story', () => eq(classifyChapterByRules('第1章 少年', '正文').type, 'story'));

    test('labelParagraphs: ข้อความเว็บสั้น = site_junk, ยาวไม่โดน', () => {
      const kinds = labelParagraphsByRules(['天才一秒记住本站地址：www.xxx.com', '他看着远方，心里想着笔趣阁里的那本书究竟写了什么样的故事，越想越觉得有趣，越想越觉得不可思议，于是决定明天一早就去书店看看那本书到底在讲什么。', '正文']);
      return eq(kinds, ['site_junk', 'story', 'story']);
    });
    test('isSiteJunkParagraph: คำอ่อนในย่อหน้าสั้นมาก = ขยะ, ในประโยคเนื้อเรื่อง = ไม่ใช่', () =>
      isSiteJunkParagraph('笔趣阁 最新章节') && isSiteJunkParagraph('上一章 返回目录 下一章') &&
      !isSiteJunkParagraph('他说下一章的内容会更精彩，让大家拭目以待吧。') && !isSiteJunkParagraph('他在笔趣阁看书看了一整夜，第二天起来眼睛都红了。'));
    test('labelParagraphs: PS ท้ายตอน -> author_note ไปจนจบ', () => {
      const paras = Array.from({ length: 10 }, (_, i) => `正文${i}`).concat(['PS：求月票！', '感谢大家支持']);
      const kinds = labelParagraphsByRules(paras);
      return eq(kinds.slice(-3), ['story', 'author_note', 'author_note']) && kinds.slice(0, 10).every(k => k === 'story');
    });
    test('labelParagraphs: PS ต้นตอนไม่นับ (ไม่อยู่ช่วงท้าย)', () => {
      const paras = ['PS：开头说明'].concat(Array.from({ length: 20 }, (_, i) => `正文${i}`));
      return labelParagraphsByRules(paras).every(k => k === 'story');
    });
    test('labelParagraphs: วงเล็บขอโหวตกลางตอน', () => eq(labelParagraphsByRules(['正文', '（求月票支持！）', '正文']), ['story', 'author_note', 'story']));

    test('resolveChapterType: กฎ high ชนะ AI', () => eq(resolveChapterType({ type: 'side_story', confidence: 'high' }, 'story', []), 'side_story'));
    test('resolveChapterType: AI ว่าประกาศ แต่เนื้อเรื่องยาว -> story', () => {
      const paras = Array.from({ length: 10 }, () => ({ src: '正文'.repeat(200) }));
      return eq(resolveChapterType({ type: 'story', confidence: 'low' }, 'author_note', paras), 'story');
    });
    test('resolveChapterType: AI ว่าประกาศ + ย่อหน้าส่วนใหญ่เป็นข้อความผู้เขียน -> author_note', () => {

        logChap(1, [['林动得到炎龙剑', 'หลินต้งได้ดาบมังกรเพลิง']], { entities: [{ src: '林动', aliases: ['小动'] }], events: [ev('item_gain', '林动', '炎龙剑', '', 'หลินต้งได้ดาบมังกรเพลิง'), ev('level', '林动', '', '淬体境')] }),
        logChap(2, [['黑衣人出手', 'ชายชุดดำลงมือ'], ['剑断了', 'ดาบหักไปพร้อมกับเกราะ']], { entities: [{ src: '黑衣人', aliases: [] }], events: [ev('item_damage', '林动', '炎龙剑', '', 'ดาบหักในการต่อสู้'), ev('item_destroy', '林动', '铠甲', '', 'เกราะพังไปพร้อมกัน'), ev('level', '林动', '', '天元境', 'ฝันว่าทะลวง', 'dream')] }),
        logChap(3, [['黑衣人就是张三', 'ที่แท้ชายชุดดำคือจางซาน']], { events: [ev('identity', '黑衣人', '张三', '', 'เปิดเผยตัวตน'), ev('title', '张三', '', '剑王', 'ได้ฉายาราชันย์ดาบ'), ev('item_restore', '林动', '炎龙剑', '', 'ซ่อมดาบแล้ว'), ev('level', '林动', '', '元丹境'), ev('identity', '路人', '林动', '', 'ข่าวลือ', 'claim')] }),
        logChap(4, [['张三死了', 'จางซานตาย']], { events: [ev('status', '张三', '', '死亡')] })
      ];
      const activeTerms = {
        '林动': { src: '林动', resolvedTgt: 'หลินต้ง', category: 'character', previousTgts: ['หลินตง'] },
        '炎龙剑': { src: '炎龙剑', resolvedTgt: 'ดาบมังกรเพลิง', category: 'equipment' },
        '张三': { src: '张三', resolvedTgt: 'จางซาน', category: 'character' },
        '剑王': { src: '剑王', resolvedTgt: 'ราชันย์ดาบ', category: 'title' },
        '元丹境': { src: '元丹境', resolvedTgt: 'ขั้นแก่นปราณ', category: 'realm' },
        '大哥A': { src: '大哥A', resolvedTgt: 'ท่านพี่', category: 'character' },
        '大哥B': { src: '大哥B', resolvedTgt: 'ท่านพี่', category: 'character' }
      };
      const extras = { bible: { characters: [{ src: '林动', aliases: [], role: 'ตัวเอก' }] } };
      const allowed = all.slice(0, 3);
      return { book: { bookId: 'b' }, all, allowed, numberOf: new Map(all.map((c, i) => [c.id, i + 1])), activeTerms, extras, groups: buildEntityGroups(allowed, extras, activeTerms) };
    }
    test('replaceWholeThaiPhrase: แทนทั้งคำ ไม่แทนกลางคำอื่น', () => eq([replaceWholeThaiPhrase('หลินตงเดินไป', 'หลินตง', 'หลินต้ง'), replaceWholeThaiPhrase('abc', 'x', 'y')], ['หลินต้งเดินไป', 'abc']));
    test('normalizeStoryLog: ตัดค่าแปลก จำกัดจำนวน ชนิดไม่รู้จักเป็น other', () => {
      const n = normalizeStoryLog({ summary: 5, entities: [{ src: '' }, { src: 'A', aliases: ['B', 'B', 3] }], events: [{ type: 'weird', subject: 'A', flag: 'x' }, { type: 'level' }, ...Array(40).fill({ type: 'other', subject: 'Z' })] });
      return n.summary === '' && eq(n.entities, [{ src: 'A', aliases: ['B'] }]) && n.events[0].type === 'other' && n.events[0].flag === '' && n.events.length === STORY_LOG_MAX_EVENTS;
    });
    test('isStoryLogFresh: ต้นฉบับเปลี่ยน = บันทึกเก่า', () => {
      const c = logChap(1, [['甲', 'ก']], { events: [] });
      const fresh = isStoryLogFresh(c);
      c.paragraphs[0].src = '乙';
      return fresh && !isStoryLogFresh(c) && !isStoryLogFresh({ paragraphs: [] });
    });
    test('buildEntityGroups: รวมชื่อเรียกอื่น ตัวตนที่เปิดเผย และฉายา (ไม่รวมข่าวลือ และตอนที่ยังไม่อ่าน)', () => {
      const d = logData();
      const g = (src) => d.groups.find(x => x.srcs.has(src));
      return g('黑衣人') === g('张三') && g('剑王') === g('张三') && g('小动') === g('林动') && g('路人') !== g('林动') && g('林动').key === '林动' && g('张三').label === 'จางซาน';
    });
    test('deriveGroupState: ของได้→หัก→ซ่อม, ของที่ถูกทำลาย, ระดับล่าสุดไม่นับความฝัน', () => {
      const d = logData();
      const group = d.groups.find(x => x.srcs.has('林动'));
      const events = collectGroupEvents(group, d.allowed, d.numberOf);
      const state = deriveGroupState(group, events, d.activeTerms).join(' | ');
      return state.includes('ระดับ/พลังล่าสุด: ขั้นแก่นปราณ [#3]') && state.includes('ดาบมังกรเพลิง (มีอยู่ (ได้คืน/ซ่อมแล้ว), #3)') && state.includes('铠甲 (ถูกทำลายแล้ว, #2)') && !state.includes('天元境');
    });
    test('findQuestionEntities: ถามด้วยชื่อไทยเก่า / ฉายา / ชื่อกำกวม', () => {
      const d = logData();
      const old = findQuestionEntities('หลินตงได้ดาบตอนไหน', d);
      const title = findQuestionEntities('ราชันย์ดาบคือใคร', d);
      const amb = findQuestionEntities('ท่านพี่เป็นใคร', d);
      return old[0]?.key === '林动' && eq(old[0].askedWithOldName, ['หลินตง']) && title[0]?.key === '张三' && amb.ambiguous.length === 1 && amb.ambiguous[0].labels.length === 2;
    });
    test('findQuestionEntities: ชื่อสั้นที่เป็นส่วนหนึ่งของชื่อยาวที่ถาม ไม่นับซ้ำ', () => {
      const d = logData();
      d.activeTerms['剑'] = { src: '剑', resolvedTgt: 'ดาบ', category: 'equipment' };
      d.groups = buildEntityGroups(d.allowed, d.extras, d.activeTerms);
      const keys = findQuestionEntities('ดาบมังกรเพลิงอยู่ไหน', d).map(e => e.key);
      return eq(keys, ['炎龙剑']);
    });
    test('computeEntityFacts: มีเส้นเวลา สถานะ ชื่ออื่น และชื่อไทยเดิม (ไม่สปอยล์ตอน 4)', () => {
      const d = logData();
      const [lin] = findQuestionEntities('หลินตง', d);
      const [zhang] = findQuestionEntities('จางซาน', d);
      const f1 = computeEntityFacts(lin, d), f2 = computeEntityFacts(zhang, d);
      return f1.includes('เส้นเวลาจากบันทึกเหตุการณ์') && f1.includes('[#2] เสียหาย') && f1.includes('ชื่อไทยเดิม') && f1.includes('ฝัน/ภาพลวง') &&
        f2.includes('ฉายา/ตำแหน่ง: ราชันย์ดาบ') && f2.includes('黑衣人') && !f2.includes('ตาย') && f2.includes('โผล่ครั้งแรก #2');
    });
    test('searchStoryEvents: หาเหตุการณ์ที่ไม่ได้เอ่ยชื่อด้วยคำค้น', () => {
      const hits = searchStoryEvents(logData(), ['เกราะ']);
      return hits.length === 1 && hits[0].object === '铠甲' && hits[0].number === 2;
    });
    test('renameInStoryLog: แก้ชื่อไทยในสรุป/รายละเอียด ไม่แตะชื่อต้นฉบับ', () => {
      const log = { summary: 'หลินตงสู้', events: [{ subject: '林动', detail: 'หลินตงได้ดาบ' }] };
      const changed = renameInStoryLog(log, s => replaceWholeThaiPhrase(s, 'หลินตง', 'หลินต้ง'));
      return changed && log.summary === 'หลินต้งสู้' && log.events[0].detail === 'หลินต้งได้ดาบ' && log.events[0].subject === '林动';
    });
    test('relevantCorrections: เลือกที่เกี่ยวกับคำถามก่อน', () => {
      const extras = { assistantCorrections: [{ question: 'จางซานคือใคร', correction: 'จางซานคืออาจารย์' }, { question: 'ดาบ', correction: 'ดาบหักตอน 5' }] };
      return eq(relevantCorrections(extras, 'ดาบอยู่ไหน').map(c => c.correction), ['ดาบหักตอน 5']) && relevantCorrections({}, 'x').length === 0;
    });
    test('buildKnownEntityList: ส่งเฉพาะคำที่อยู่ในตอนนั้น + ตัวละครในคู่มือ', () => {
      const d = logData();
      const list = buildKnownEntityList(d.extras, d.activeTerms, '张三拔出炎龙剑');
      return list.includes('林动') && list.includes('炎龙剑 = ดาบมังกรเพลิง') && list.includes('张三') && !list.includes('元丹境');
    });
    const passed = results.filter(r => r.ok).length;
    const summary = document.getElementById('summary');
    summary.textContent = `ผ่าน ${passed}/${results.length}`;
    summary.className = passed === results.length ? 'pass' : 'fail';
    document.getElementById('results').innerHTML = results.map(r =>
      `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${r.name.replace(/</g, '&lt;')}${r.detail ? ' — ' + r.detail.replace(/</g, '&lt;') : ''}</li>`
    ).join('');
    window.__testResults = results;
  </script>
