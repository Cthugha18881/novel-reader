name: Test and deploy Dusktale to GitHub Pages

on:
  push:
    branches:
      - codex/complete-app
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ทดสอบก่อนทุกครั้ง: ไม่ผ่าน = ไม่ deploy (หน้าเว็บจริงยังเป็นเวอร์ชันเดิม)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (ทุกไฟล์ JavaScript)
        run: |
          for f in js/*.js sw.js; do node --check "$f" || exit 1; done
          node --check tests/run-ci.mjs
          for f in $(find server -name '*.js' -not -path '*/node_modules/*'); do node --check "$f" || exit 1; done
      - name: Server tests (เซิร์ฟเวอร์แปลของ Dusktale, จำลอง Supabase/OpenRouter)
        working-directory: server
        run: node --test
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Unit tests + app smoke test
        run: node tests/run-ci.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
